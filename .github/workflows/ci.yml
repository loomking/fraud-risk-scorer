name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        env:
          # Use a dummy key in CI — Evidence Agent tests use mocked LLM
          GROQ_API_KEY: "ci-dummy-key"
          DATABASE_URL: "sqlite:///./test_fraud_risk.db"
        run: uv run pytest tests/ -v --tb=short

      - name: Lint (ruff)
        run: uv run ruff check src/ api/ tests/ || true
