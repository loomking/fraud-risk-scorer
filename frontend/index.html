<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fraud Risk Scorer Dashboard</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#0E1117",
                        "surface": "#161B22",
                        "outline-variant": "#30363D",
                        "brand-primary": "#2F81F7",
                        "brand-success": "#238636",
                        "brand-danger": "#DA3633",
                        "on-surface": "#E6EDF3",
                        "on-surface-variant": "#8B949E",
                        "surface-variant": "#21262D",
                        "badge-bg": "rgba(255,255,255,0.05)"
                    },
                    borderRadius: { "DEFAULT": "4px" },
                    fontFamily: {
                        "body": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
            font-family: theme('fontFamily.body');
            font-size: 13px;
        }
        .panel {
            background-color: theme('colors.surface');
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.DEFAULT');
        }
        .panel-header {
            border-bottom: 1px solid theme('colors.outline-variant');
            padding: 12px;
        }
        .input-field {
            background-color: theme('colors.background');
            border: 1px solid theme('colors.outline-variant');
            color: theme('colors.on-surface');
            font-family: theme('fontFamily.body');
            font-size: 13px;
            padding: 6px 8px;
            border-radius: theme('borderRadius.DEFAULT');
            width: 100%;
        }
        .input-field:focus {
            outline: none;
            border-color: theme('colors.brand-primary');
        }
        .btn-primary {
            background-color: theme('colors.brand-primary');
            color: #ffffff;
            border-radius: theme('borderRadius.DEFAULT');
            padding: 6px 16px;
            font-family: theme('fontFamily.body');
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th {
            color: theme('colors.on-surface-variant');
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid theme('colors.outline-variant');
            letter-spacing: 0.05em;
        }
        .data-table td {
            font-family: theme('fontFamily.mono');
            font-size: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid theme('colors.outline-variant');
        }
        .data-table tr.clickable:hover { background-color: theme('colors.surface-variant'); cursor: pointer; }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            border-radius: theme('borderRadius.DEFAULT');
            border: 1px solid transparent;
            letter-spacing: 0.05em;
        }
        .badge-danger { background-color: theme('colors.brand-danger'); color: #ffffff; border: none; }
        .badge-success { background-color: theme('colors.brand-success'); color: #ffffff; border: none; }
        
        @keyframes revealRow {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal { animation: revealRow 0.3s ease-out forwards; }
        
        .score-bar-container {
            width: 60px; height: 4px; background-color: theme('colors.outline-variant'); border-radius: 2px; overflow: hidden;
        }
        .score-bar-fill { height: 100%; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 gap-4">
    <div id="root"></div>

    <script type="text/babel">
        const API = (window.location.origin === "null" || window.location.protocol === "file:") 
            ? "https://fraud-risk-scorer.onrender.com" 
            : window.location.origin;

        // Operating point presets
        const THRESHOLD_PRESETS = [
            { value: 0.035, label: 'High capture', category: 'aggressive' },
            { value: 0.045, label: 'High capture', category: 'aggressive' },
            { value: 0.050, label: 'Balanced (default)', category: 'balanced' },
            { value: 0.070, label: 'Tight ops', category: 'conservative' },
            { value: 0.090, label: 'High precision', category: 'conservative' },
            { value: 0.100, label: 'High precision', category: 'conservative' },
            { value: 0.150, label: 'Strict', category: 'conservative' },
        ];

        function App() {
            const [report, setReport] = React.useState({ model_version: 'Loading...', threshold: 0.05, feature_count: 0, total_scored: 0 });
            const [txns, setTxns] = React.useState([]);
            const [expandedTxn, setExpandedTxn] = React.useState(null);
            const [prCurve, setPrCurve] = React.useState([]);
            const [activeThreshold, setActiveThreshold] = React.useState(0.050);
            
            const [detailsMap, setDetailsMap] = React.useState({});
            
            const [form, setForm] = React.useState({
                txnId: 1000001,
                txnDt: 86400,
                amt: 150.00,
                product: 'W',
                card1: 4000,
                card4: 'visa',
                card6: 'debit',
                email: 'gmail.com'
            });
            const [scoring, setScoring] = React.useState(false);

            // Find closest PR curve point for the active threshold
            const activeStats = React.useMemo(() => {
                if (!prCurve.length) return { review_rate: 0, fraud_capture: 0, precision: 0 };
                let closest = prCurve[0];
                let minDist = Math.abs(prCurve[0].threshold - activeThreshold);
                for (const p of prCurve) {
                    const dist = Math.abs(p.threshold - activeThreshold);
                    if (dist < minDist) { minDist = dist; closest = p; }
                }
                return closest;
            }, [prCurve, activeThreshold]);

            React.useEffect(() => {
                fetch(`${API}/report`)
                    .then(res => res.json())
                    .then(data => {
                        setReport({
                            model_version: data.model_version,
                            threshold: data.threshold,
                            feature_count: data.feature_count,
                            total_scored: data.total_scored !== undefined ? data.total_scored : 0
                        });
                        if (data.recent_transactions) setTxns(data.recent_transactions);
                        if (data.pr_curve) setPrCurve(data.pr_curve);
                    })
                    .catch(e => console.error("Report error:", e));
            }, []);

            const handleScore = async () => {
                setScoring(true);
                const payload = {
                    TransactionID: parseInt(form.txnId),
                    TransactionDT: parseInt(form.txnDt),
                    TransactionAmt: parseFloat(form.amt),
                    ProductCD: form.product,
                    card1: parseInt(form.card1),
                    card4: form.card4,
                    card6: form.card6,
                    P_emaildomain: form.email
                };

                try {
                    const res = await fetch(`${API}/score`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    
                    if (!res.ok) {
                        alert(`Error: ${JSON.stringify(data)}`);
                        setScoring(false);
                        return;
                    }

                    const newTxn = {
                        transaction_id: data.transaction_id,
                        risk_probability: data.risk_probability,
                        threshold: data.threshold,
                        decision: data.decision,
                        model_version: data.model_version,
                        amount: payload.TransactionAmt,
                        timestamp: new Date().toISOString()
                    };

                    setTxns(prev => [newTxn, ...prev]);
                    setReport(prev => ({ ...prev, total_scored: prev.total_scored + 1 }));
                    setForm(prev => ({ ...prev, txnId: prev.txnId + 1 }));

                } catch (e) {
                    alert(`Network error: ${e.message}`);
                }
                setScoring(false);
            };

            const toggleRow = async (txn) => {
                const tid = txn.transaction_id;
                if (expandedTxn === tid) {
                    setExpandedTxn(null);
                    return;
                }
                
                setExpandedTxn(tid);

                // Fetch details if not already fetched
                if (!detailsMap[tid]) {
                    setDetailsMap(prev => ({ ...prev, [tid]: { loadingEvidence: true, loadingAudit: true } }));
                    
                    // Fetch Audit
                    fetch(`${API}/audit/${tid}`).then(r => r.json()).then(data => {
                        setDetailsMap(prev => ({ 
                            ...prev, 
                            [tid]: { ...prev[tid], audit: data.events || [], loadingAudit: false }
                        }));
                    }).catch(e => {
                        setDetailsMap(prev => ({ 
                            ...prev, 
                            [tid]: { ...prev[tid], auditError: e.message, loadingAudit: false }
                        }));
                    });

                    // Fetch Evidence if FLAG
                    if (txn.decision === 'FLAG') {
                        fetch(`${API}/evidence/${tid}`, { method: 'POST' }).then(r => r.json()).then(data => {
                            setDetailsMap(prev => ({ 
                                ...prev, 
                                [tid]: { ...prev[tid], evidence: data, loadingEvidence: false }
                            }));
                        }).catch(e => {
                            setDetailsMap(prev => ({ 
                                ...prev, 
                                [tid]: { ...prev[tid], evidenceError: e.message, loadingEvidence: false }
                            }));
                        });
                    } else {
                         setDetailsMap(prev => ({ 
                            ...prev, 
                            [tid]: { ...prev[tid], loadingEvidence: false }
                        }));
                    }
                }
            };

            return (
                <div className="flex flex-col gap-4 max-w-[1440px] mx-auto w-full">
                    {/* Top Metric Bar */}
                    <header className="panel bg-[#1C2128] shadow-md flex items-center justify-between p-3 font-mono text-[13px]">
                        <div className="flex items-center gap-6">
                            <span><span className="text-on-surface-variant">Model:</span> {report.model_version}</span>
                            <span><span className="text-on-surface-variant">Threshold:</span> <span className="text-brand-danger">{(activeThreshold * 100).toFixed(1)}%</span></span>
                            <span><span className="text-on-surface-variant">Features:</span> {report.feature_count}</span>
                        </div>
                        <div>
                            <span><span className="text-on-surface-variant">Total Scored:</span> {report.total_scored}</span>
                        </div>
                    </header>
                    <div className="text-on-surface-variant text-[12px] bg-surface-variant border border-outline-variant rounded p-3 font-mono">
                        <span className="font-bold text-on-surface">Fraud Risk Scorer (v2.0.1)</span> — Built with 22 live-form compatible features (no V-cols). 
                        Please read the <a href="https://github.com/loomking/fraud-risk-scorer/blob/master/README.md#model--limitations" target="_blank" className="text-brand-primary hover:underline">README</a> for full details on the False-Positive Cost Curve, Portability Tradeoffs, and UI Defense Analysis.
                    </div>

                    <main className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                        {/* Left Column: Form */}
                        <section className="lg:col-span-4 panel flex flex-col self-start">
                            <div className="panel-header">
                                <h2 className="text-[14px] font-semibold m-0 text-on-surface">Score a transaction</h2>
                            </div>
                            <div className="p-4 flex flex-col gap-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Txn ID</label>
                                        <input className="input-field font-mono" type="number" value={form.txnId} onChange={e => setForm({...form, txnId: e.target.value})} />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Date/Time (s) <span className="normal-case font-normal opacity-70 ml-1">(seconds elapsed, not real date/time)</span></label>
                                        <input className="input-field font-mono" type="number" value={form.txnDt} onChange={e => setForm({...form, txnDt: e.target.value})} />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Amount (₹)</label>
                                        <input className="input-field font-mono" type="number" step="0.01" value={form.amt} onChange={e => setForm({...form, amt: e.target.value})} />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Product <span className="normal-case font-normal opacity-70 ml-1">(coded category)</span></label>
                                        <input className="input-field" type="text" value={form.product} onChange={e => setForm({...form, product: e.target.value})} />
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Card Identifier <span className="normal-case font-normal opacity-70 ml-1">(internal token)</span></label>
                                        <input className="input-field font-mono" type="number" value={form.card1} onChange={e => setForm({...form, card1: e.target.value})} />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Network Brand</label>
                                        <select className="input-field" value={form.card4} onChange={e => setForm({...form, card4: e.target.value})}>
                                            <option value="visa">visa</option>
                                            <option value="mastercard">mastercard</option>
                                            <option value="discover">discover</option>
                                            <option value="american express">amex</option>
                                        </select>
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Funding Type</label>
                                        <select className="input-field" value={form.card6} onChange={e => setForm({...form, card6: e.target.value})}>
                                            <option value="debit">debit</option>
                                            <option value="credit">credit</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Email</label>
                                    <input className="input-field" type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                                </div>
                                <div className="pt-2">
                                    <button className="btn-primary w-full flex justify-center items-center gap-2" onClick={handleScore} disabled={scoring}>
                                        {scoring ? <span className="material-symbols-outlined animate-spin text-[16px]">sync</span> : null}
                                        {scoring ? 'Scoring...' : 'Execute Risk Analysis'}
                                    </button>
                                </div>
                            </div>

                            {/* Threshold Control Panel */}
                            <div className="panel-header border-t border-outline-variant mt-0">
                                <h2 className="text-[14px] font-semibold m-0 text-on-surface">Operating Threshold</h2>
                            </div>
                            <div className="p-4 flex flex-col gap-3">
                                {/* Preset buttons */}
                                <div className="flex flex-wrap gap-1">
                                    {THRESHOLD_PRESETS.map(p => {
                                        const isActive = Math.abs(activeThreshold - p.value) < 0.001;
                                        const catColor = p.category === 'aggressive' ? 'border-[#F0883E]' : p.category === 'balanced' ? 'border-brand-primary' : 'border-brand-success';
                                        const activeBg = p.category === 'aggressive' ? 'bg-[#F0883E]/20 text-[#F0883E]' : p.category === 'balanced' ? 'bg-brand-primary/20 text-brand-primary' : 'bg-brand-success/20 text-brand-success';
                                        return (
                                            <button key={p.value}
                                                className={`px-2 py-1 text-[11px] font-mono border rounded transition-all ${isActive ? `${catColor} ${activeBg} font-bold` : 'border-outline-variant text-on-surface-variant hover:border-on-surface-variant'}`}
                                                onClick={() => setActiveThreshold(p.value)}
                                            >
                                                {(p.value * 100).toFixed(1)}%
                                            </button>
                                        );
                                    })}
                                </div>
                                {/* Label for current preset */}
                                <div className="text-[11px] text-on-surface-variant">
                                    {(THRESHOLD_PRESETS.find(p => Math.abs(p.value - activeThreshold) < 0.001) || {}).label || 'Custom'}
                                </div>
                                {/* Live stats from PR curve */}
                                <div className="grid grid-cols-3 gap-2">
                                    <div className="bg-background border border-outline-variant rounded p-2 text-center">
                                        <div className="text-[10px] text-on-surface-variant uppercase tracking-wider">Review Rate</div>
                                        <div className="font-mono text-[16px] font-bold text-[#F0883E]">{(activeStats.review_rate * 100).toFixed(1)}%</div>
                                    </div>
                                    <div className="bg-background border border-outline-variant rounded p-2 text-center">
                                        <div className="text-[10px] text-on-surface-variant uppercase tracking-wider">Fraud Capture</div>
                                        <div className="font-mono text-[16px] font-bold text-brand-danger">{(activeStats.fraud_capture * 100).toFixed(1)}%</div>
                                    </div>
                                    <div className="bg-background border border-outline-variant rounded p-2 text-center">
                                        <div className="text-[10px] text-on-surface-variant uppercase tracking-wider">Precision</div>
                                        <div className="font-mono text-[16px] font-bold text-brand-success">{(activeStats.precision * 100).toFixed(1)}%</div>
                                    </div>
                                </div>
                                <div className="text-[10px] text-on-surface-variant leading-tight">
                                    Changing threshold reclassifies scored transactions live. Lower threshold = catch more fraud but review more transactions.
                                </div>
                            </div>
                        </section>

                        {/* Right Column: Table */}
                        <section className="lg:col-span-8 panel flex flex-col">
                            <div className="panel-header flex justify-between items-center">
                                <h2 className="text-[14px] font-semibold m-0 text-on-surface">Recent Scored Transactions</h2>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>Txn ID</th>
                                            <th className="text-right">Amount</th>
                                            <th>Risk</th>
                                            <th>Threshold</th>
                                            <th>Decision</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {txns.length === 0 ? (
                                            <tr><td colSpan="6" className="text-center text-on-surface-variant py-8">No transactions scored yet.</td></tr>
                                        ) : txns.map(t => {
                                            const isExpanded = expandedTxn === t.transaction_id;
                                            // Live reclassification based on active threshold
                                            const liveDecision = t.risk_probability >= activeThreshold ? 'FLAG' : 'PASS';
                                            const isFlag = liveDecision === 'FLAG';
                                            const riskPct = Math.min(t.risk_probability * 100, 100);
                                            const threshPct = activeThreshold * 100;
                                            const riskColor = isFlag ? 'bg-brand-danger text-brand-danger' : 'bg-brand-success text-brand-success';
                                            const details = detailsMap[t.transaction_id] || {};
                                            
                                            return (
                                                <React.Fragment key={t.transaction_id + '-' + t.created_at}>
                                                    <tr className={`clickable animate-reveal ${isExpanded ? 'bg-surface-variant' : ''}`} onClick={() => toggleRow(t)}>
                                                        <td className={isFlag ? "border-l-[3px] border-l-brand-danger pl-[9px]" : "pl-[12px]"}>{t.transaction_id}</td>
                                                        <td className="text-right">₹{(t.amount || 0).toFixed(2)}</td>
                                                        <td>
                                                            <div className="flex items-center gap-2">
                                                                <div className="score-bar-container"><div className={`score-bar-fill ${riskColor.split(' ')[0]}`} style={{width: `${riskPct}%`}}></div></div>
                                                                <span className={riskColor.split(' ')[1]}>{riskPct.toFixed(1)}</span>
                                                            </div>
                                                        </td>
                                                        <td>{threshPct.toFixed(1)}</td>
                                                        <td><span className={`badge ${isFlag ? 'badge-danger' : 'badge-success'}`}>{liveDecision}</span></td>
                                                        <td><button className={`hover:text-brand-primary ${isExpanded ? 'text-brand-primary' : 'text-on-surface-variant'}`}><span className="material-symbols-outlined text-[16px]">{isExpanded ? 'expand_less' : 'expand_more'}</span></button></td>
                                                    </tr>
                                                    
                                                    {isExpanded && (
                                                        <tr>
                                                            <td className="p-0 border-b border-outline-variant" colSpan="6">
                                                                <div className={`p-4 flex flex-col gap-4 bg-[#1C2128] ${isFlag ? 'border-l-[3px] border-l-brand-danger pl-[9px]' : 'pl-[12px]'}`}>
                                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                                        
                                                                        {/* Evidence Packet (Only for FLAGs) */}
                                                                        {isFlag ? (
                                                                            <div className="flex flex-col gap-2">
                                                                                <h3 className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant m-0">Evidence Packet</h3>
                                                                                <div className="bg-background border border-outline-variant rounded p-3 font-mono text-[12px] text-on-surface h-full">
                                                                                    {details.loadingEvidence ? (
                                                                                        <div className="text-on-surface-variant flex items-center gap-2"><span className="material-symbols-outlined animate-spin text-[16px]">sync</span> Generating evidence...</div>
                                                                                    ) : details.evidenceError ? (
                                                                                        <div className="text-brand-danger">{details.evidenceError}</div>
                                                                                    ) : details.evidence ? (
                                                                                        <div className="flex flex-col gap-2">
                                                                                            <div className="text-on-surface-variant mb-2">{details.evidence.summary}</div>
                                                                                            <div className={`mb-2 font-bold ${details.evidence.grounding_valid ? 'text-brand-success' : 'text-brand-danger'}`}>
                                                                                                Grounding: {details.evidence.grounding_valid ? '✓ Valid' : '✗ Failed'}
                                                                                            </div>
                                                                                            {details.evidence.evidence && details.evidence.evidence.map((item, i) => (
                                                                                                <div key={i} className="mb-2">
                                                                                                    <div><span className="text-brand-primary">CLAIM:</span> {item.claim}</div>
                                                                                                    <div className="text-on-surface-variant ml-4 flex flex-wrap gap-2 mt-1">
                                                                                                        {item.sources.map((s, si) => <span key={si} className="bg-surface px-1 border border-outline-variant rounded">{s}</span>)}
                                                                                                    </div>
                                                                                                </div>
                                                                                            ))}
                                                                                            <div className="text-on-surface-variant text-[11px] mt-2">Agent: {details.evidence.agent_model_version}</div>
                                                                                        </div>
                                                                                    ) : null}
                                                                                </div>
                                                                            </div>
                                                                        ) : (
                                                                             <div className="flex flex-col gap-2">
                                                                                <h3 className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant m-0">Evidence Packet</h3>
                                                                                <div className="bg-background border border-outline-variant rounded p-3 font-mono text-[12px] text-on-surface-variant italic flex items-center justify-center h-full">
                                                                                    Not generated for PASS decisions.
                                                                                </div>
                                                                            </div>
                                                                        )}

                                                                        {/* Audit Trail */}
                                                                        <div className="flex flex-col gap-2">
                                                                            <h3 className="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant m-0">Audit Trail</h3>
                                                                            <div className="bg-background border border-outline-variant rounded p-3 font-mono text-[12px] text-on-surface flex flex-col gap-1 overflow-auto h-full max-h-[300px]">
                                                                                {details.loadingAudit ? (
                                                                                    <div className="text-on-surface-variant flex items-center gap-2"><span className="material-symbols-outlined animate-spin text-[16px]">sync</span> Fetching audit trail...</div>
                                                                                ) : details.auditError ? (
                                                                                    <div className="text-brand-danger">{details.auditError}</div>
                                                                                ) : details.audit && details.audit.length > 0 ? (
                                                                                    details.audit.map((ev, i) => {
                                                                                        let evColor = 'text-on-surface';
                                                                                        if (ev.event_type === 'score_computed') evColor = 'text-[#3b82f6]';
                                                                                        if (ev.event_type === 'decision_made') evColor = 'text-brand-primary';
                                                                                        if (ev.event_type === 'evidence_generated') evColor = 'text-brand-success';
                                                                                        if (ev.event_type === 'grounding_failure') evColor = 'text-brand-danger';
                                                                                        
                                                                                        return (
                                                                                            <div key={i} className="mb-2">
                                                                                                <div className="text-on-surface-variant">[{ev.created_at}]</div>
                                                                                                <div className={evColor}>{ev.event_type}</div>
                                                                                                {ev.event_data && (
                                                                                                    <div className="ml-4 mt-1 opacity-80">{JSON.stringify(ev.event_data)}</div>
                                                                                                )}
                                                                                            </div>
                                                                                        );
                                                                                    })
                                                                                ) : (
                                                                                    <div className="text-on-surface-variant">No events found.</div>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )}
                                                </React.Fragment>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
