[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraud-risk-scorer"
version = "0.1.0"
description = "Razorpay AI Buildathon — Track 2: Fraud Risk Scorer + Evidence Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fraud Risk Scorer Team" }]

dependencies = [
    # ── Data / ML ──────────────────────────────────────────────────────────────
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.3",
    "imbalanced-learn>=0.12.4",

    # ── Plotting (EDA + evaluation only) ──────────────────────────────────────
    "matplotlib>=3.9.4",
    "seaborn>=0.13.2",

    # ── API ───────────────────────────────────────────────────────────────────
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",

    # ── Database ──────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",

    # ── LLM / Evidence Agent ──────────────────────────────────────────────────
    "groq>=0.13.1",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "joblib>=1.4.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.6",
    "mypy>=1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
